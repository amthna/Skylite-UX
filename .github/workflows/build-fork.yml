name: Build and publish fork image

on:
  push:
    branches: [dev, swipe-navigation, pinch-zoom-views, budget-iframe, budget-widgets]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Tag by branch so each feature branch gets its own testable image.
          tags: |
            ghcr.io/amthna/skylite-ux:${{ github.ref_name }}
            ghcr.io/amthna/skylite-ux:${{ github.run_id }}
